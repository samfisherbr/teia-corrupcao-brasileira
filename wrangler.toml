# ============================================================================
# Configuração do Worker do Cloudflare — Teia da Corrupção
# ============================================================================
# O site roda num Cloudflare Worker, gerado pelo adaptador OpenNext
# (@opennextjs/cloudflare) a partir do build do Next.js. Este arquivo é a fonte
# da verdade do runtime: nome, bindings, data e flags de compatibilidade.
#
# Comandos (package.json):
#   npm run preview  → build + site rodando localmente no runtime do Worker
#   npm run deploy   → build + publica em produção
#   npm run upload   → build + envia uma VERSÃO nova sem publicar (preview)
#
# Deploy pelo GitHub: Workers & Pages → teiadacorrupcao → Settings → Build
# (Workers Builds), com "npx opennextjs-cloudflare build" como comando de
# build e "npx opennextjs-cloudflare deploy" como comando de deploy.
#
# Até 16/11/2026 o site rodava no Cloudflare Pages (projeto
# "teia-corrupcao-brasileira", adaptador next-on-pages, descontinuado). Por
# isso o Worker tem outro nome.
# ============================================================================

name = "teiadacorrupcao"
main = ".open-next/worker.js"

# Mudar a data pode alterar o comportamento do runtime; avance só depois de
# testar num preview. nodejs_compat é exigido pelo OpenNext.
compatibility_date = "2026-10-26"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Endereço *.workers.dev ligado para testar antes de mudar o domínio; o
# next.config.js redireciona o endereço de produção dele para o domínio próprio.
workers_dev = true
preview_urls = true

# Domínio próprio, servido por este Worker desde 16/11/2026.
routes = [
  { pattern = "teiadacorrupcao.io", custom_domain = true },
]

# Arquivos estáticos (JS/CSS do Next, public/, páginas pré-geradas).
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# O Worker chamando a si mesmo (usado pelo OpenNext em revalidações).
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "teiadacorrupcao"

# Banco D1 lido pelas páginas e por /api/graph (env.DB). Vale para produção e
# para as versões de preview.
[[d1_databases]]
binding = "DB"
database_name = "corruption_graph_db"
database_id = "8ef78bfa-f668-40d9-8c30-d2db9dda631a"

# Logs persistentes (console.error de /api/graph etc.) em Workers → Logs.
[observability]
enabled = true
